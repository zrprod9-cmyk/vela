# Drop-in for vela-npu.service: when vela-npu-setup.service has linked /run/vela-npu/graphs (Snapdragon 8 Elite, SM8750), the v79 build
# of each graph is mounted read-only over /usr/lib64/vela-npu/<graph>.bin in the daemon's own mount namespace, so --graph-dir loads it.
# Without the link ("-": a missing source is ignored) nothing changes.
[Service]
BindReadOnlyPaths=-/run/vela-npu/graphs/nf4_k1h.bin:/usr/lib64/vela-npu/nf4_k1h.bin
BindReadOnlyPaths=-/run/vela-npu/graphs/nf4_k1h_360.bin:/usr/lib64/vela-npu/nf4_k1h_360.bin
BindReadOnlyPaths=-/run/vela-npu/graphs/nf4_k1h_450.bin:/usr/lib64/vela-npu/nf4_k1h_450.bin
BindReadOnlyPaths=-/run/vela-npu/graphs/nf4up_k1h.bin:/usr/lib64/vela-npu/nf4up_k1h.bin
BindReadOnlyPaths=-/run/vela-npu/graphs/nf4up_k1h_450.bin:/usr/lib64/vela-npu/nf4up_k1h_450.bin
BindReadOnlyPaths=-/run/vela-npu/graphs/nf4up_k1h_360.bin:/usr/lib64/vela-npu/nf4up_k1h_360.bin
BindReadOnlyPaths=-/run/vela-npu/graphs/nf4_exact.bin:/usr/lib64/vela-npu/nf4_exact.bin
BindReadOnlyPaths=-/run/vela-npu/graphs/nf4_k1h_452.bin:/usr/lib64/vela-npu/nf4_k1h_452.bin
BindReadOnlyPaths=-/run/vela-npu/graphs/nf4up_k1h_452.bin:/usr/lib64/vela-npu/nf4up_k1h_452.bin
BindReadOnlyPaths=-/run/vela-npu/graphs/nf4_k1h_405.bin:/usr/lib64/vela-npu/nf4_k1h_405.bin
BindReadOnlyPaths=-/run/vela-npu/graphs/nf4up_k1h_405.bin:/usr/lib64/vela-npu/nf4up_k1h_405.bin
BindReadOnlyPaths=-/run/vela-npu/graphs/nf4_k1h_400.bin:/usr/lib64/vela-npu/nf4_k1h_400.bin
BindReadOnlyPaths=-/run/vela-npu/graphs/nf4up_k1h_400.bin:/usr/lib64/vela-npu/nf4up_k1h_400.bin
BindReadOnlyPaths=-/run/vela-npu/graphs/nf4_k1h_324.bin:/usr/lib64/vela-npu/nf4_k1h_324.bin
BindReadOnlyPaths=-/run/vela-npu/graphs/nf4up_k1h_324.bin:/usr/lib64/vela-npu/nf4up_k1h_324.bin
BindReadOnlyPaths=-/run/vela-npu/graphs/nf4_k1h_270.bin:/usr/lib64/vela-npu/nf4_k1h_270.bin
BindReadOnlyPaths=-/run/vela-npu/graphs/nf4up_k1h_270.bin:/usr/lib64/vela-npu/nf4up_k1h_270.bin
