# Drop-in for vela-npu-setup.service: on the Snapdragon 8 Elite (SM8750, Hexagon v79) it links /run/vela-npu/graphs to
# /usr/lib64/vela-npu/v79, and on the Snapdragon 8 Elite Gen 5 (SM8850 / Kaanapali / Canoe, Hexagon v81) to /usr/lib64/vela-npu/v81
# when a v81 graph set is bundled; vela-npu.service.d/50-vela-npu-chip.conf then uses it. Without v81/ (or on SM8550/SM8650),
# nothing is created and the daemon uses the HTP v73 graphs in /usr/lib64/vela-npu (which also run bit-exact on SM8850 HTP v81).
[Service]
ExecStart=/usr/bin/sh -c 'if grep -qzx qcom,sm8750 /proc/device-tree/compatible; then d=/usr/lib64/vela-npu/v79; l="SM8750: using the Hexagon v79 graphs"; elif grep -qzx qcom,kaanapali /proc/device-tree/compatible || grep -qzx qcom,sm8850 /proc/device-tree/compatible || grep -qzx qcom,canoe /proc/device-tree/compatible || grep -qzx qcom,canoep /proc/device-tree/compatible; then [ -f /usr/lib64/vela-npu/v81/nf4_k1h.bin ] || exit 0; d=/usr/lib64/vela-npu/v81; l="SM8850: using the Hexagon v81 graphs"; else exit 0; fi; mkdir -p /run/vela-npu && ln -sfn "$d" /run/vela-npu/graphs && echo "$l in $d"'
