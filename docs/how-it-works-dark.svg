<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="How Vela upscales one frame">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker></defs>
<rect width="960" height="470" rx="12" fill="#0d1117"/>
<rect x="20" y="24" width="250" height="112" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/>
<text x="36" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Game (DX12, Proton)</text>
<text x="36" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9198a1">asks for DLSS, FSR 2/3 or XeSS</text>
<text x="36" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9198a1">gives colour, depth,</text>
<text x="36" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9198a1">motion vectors, jitter</text>
<rect x="340" y="24" width="270" height="112" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/>
<text x="356" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Vela’s OptiScaler fork</text>
<text x="356" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9198a1">installed as dxgi.dll (ARM64EC)</text>
<text x="356" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9198a1">takes the upscaler call,</text>
<text x="356" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9198a1">picks the model from the panel</text>
<rect x="680" y="24" width="260" height="112" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/>
<text x="696" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">FSR 4 provider (Vulkan)</text>
<text x="696" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9198a1">FSR 4.1.1 network, INT8</text>
<text x="696" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9198a1">FSR 4 Fast: lighter GPU passes</text>
<text x="696" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9198a1">no NPU part → all on the GPU</text>
<line x1="270" y1="80" x2="338" y2="80" stroke="#6e7681" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="610" y1="80" x2="678" y2="80" stroke="#6e7681" stroke-width="1.6" marker-end="url(#a)"/>
<text x="20" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#4493f8">ONE FRAME, FSR 4 WITH THE VELA NPU PART</text>
<rect x="20" y="196" width="280" height="128" rx="10" fill="#0f2540" stroke="#1f6feb" stroke-width="1.5"/>
<text x="36" y="224" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Adreno 740 GPU</text>
<text x="36" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9198a1">pre-pass: inputs → network tensors</text>
<text x="36" y="268" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9198a1">output passes: network result</text>
<text x="36" y="288" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9198a1">→ the upscaled frame</text>
<rect x="375" y="196" width="245" height="128" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/>
<text x="391" y="224" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Vela NPU layer + daemon</text>
<text x="391" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9198a1">shares a dma-buf with the</text>
<text x="391" y="268" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9198a1">daemon; the GPU waits for it</text>
<text x="391" y="288" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9198a1">in the same frame; NPU fails → GPU</text>
<rect x="690" y="196" width="250" height="128" rx="10" fill="#0f2d1c" stroke="#2ea043" stroke-width="1.5"/>
<text x="706" y="224" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Hexagon NPU (HTP v73)</text>
<text x="706" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9198a1">the FSR 4 network as a compiled</text>
<text x="706" y="268" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9198a1">QNN graph, INT8 (via FastRPC)</text>
<text x="706" y="288" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9198a1">Control 1080p: 8.3 ms per frame</text>
<line x1="300" y1="248" x2="373" y2="248" stroke="#6e7681" stroke-width="1.6" marker-end="url(#a)"/>
<text x="337" y="240" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#9198a1" text-anchor="middle">tensors</text>
<line x1="620" y1="248" x2="688" y2="248" stroke="#6e7681" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="688" y1="286" x2="622" y2="286" stroke="#6e7681" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="373" y1="286" x2="300" y2="286" stroke="#6e7681" stroke-width="1.6" marker-end="url(#a)"/>
<text x="337" y="306" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#9198a1" text-anchor="middle">result</text>
<line x1="810" y1="136" x2="810" y2="160" stroke="#6e7681" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="810" y1="160" x2="160" y2="160" stroke="#6e7681" stroke-width="1.6"/>
<line x1="160" y1="160" x2="160" y2="194" stroke="#6e7681" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="20" y="360" width="920" height="86" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/>
<text x="36" y="388" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Output</text>
<text x="36" y="412" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9198a1">the game’s 1920×1080 (or 1280×720) frame, upscaled; the game’s UI is drawn on top as usual.</text>
<text x="36" y="432" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9198a1">FSR 3 and SGSR 2 run on the GPU only. Resident Evil 4: a small interceptor of the game’s built-in FSR 2 replaces the fork.</text>
<line x1="160" y1="324" x2="160" y2="358" stroke="#6e7681" stroke-width="1.6" marker-end="url(#a)"/>
</svg>
